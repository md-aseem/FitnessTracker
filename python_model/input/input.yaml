quantum: 2p0
ambient_temperature: 25

# operational
n_cycles: 1
cycles:
  -

max_charge_rate: 0.23
max_discharge_rate: 0.25
battery_type: eve_306           # eve_306, catl_306
battery_life: bol                # bol, eol
